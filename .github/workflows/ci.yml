name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estaticos:
    name: Lint, contrato, secretos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Contrato OpenAPI
        run: npm run lint:openapi
      - name: Secretos
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --no-git --source . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --exit-code 1
      - name: Dependencias
        run: npm run audit:deps

  pruebas:
    name: Suite, BDD, PostgreSQL y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: casas_grandes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casas_grandes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/casas_grandes_test?sslmode=disable
      CHG025_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/casas_grandes_test?sslmode=disable
      JWT_SECRET: test-only-ci-secret-at-least-32-characters
      SKIP_INIT_SCHEMA: "true"
      PGSSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Suite completa
        run: npm test
      - name: BDD
        run: npm run test:bdd
      - name: Cobertura
        run: npm run test:coverage
